apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: procurement-agent
  description: AI agent that answers natural language questions about purchase orders using live data from SAP S/4HANA On-Premise via BTP Business Connector.
  version: "1.0.0"

provides:
  apis:
    - name: procurement-agent
      kind: a2a
      ordId: customer.build:apiResource:s4hana-procurement-agent-9ac6b.procurement-agent:v1

requires:
  - name: sap-s4-purchaseorder-process-srv-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:s4hana-procurement-agent-9ac6b.sap-s4-purchaseorder-process-srv-mcp-server:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
